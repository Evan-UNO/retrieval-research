<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval Research — one skill, six research workflows</title>
  <desc id="desc">Choose a workflow for multimodal retrieval research: Read papers, Compare methods, Check metrics and protocols, Reproduce a baseline, Diagnose retrieval results, or Brief your research progress. The workflows are choices, not a required sequence.</desc>
  <rect width="1200" height="760" rx="20" fill="#101827"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g id="heading">
      <text x="64" y="88" fill="#F6F3EB" font-size="64" font-weight="650">Retrieval Research</text>
      <text x="67" y="138" fill="#ACBDD2" font-size="32">One skill. Six research workflows.</text>
    </g>
    <g id="read">
      <rect x="64" y="182" width="520" height="150" rx="10" fill="#1A2940"/>
      <path d="M65 210v94" stroke="#49D5B1" stroke-width="4"/>
      <text x="96" y="248" fill="#F6F3EB" font-size="50" font-weight="600">Read</text>
      <text x="96" y="294" fill="#ACBDD2" font-size="28">Papers &amp; concepts</text>
      <text x="538" y="222" fill="#49D5B1" font-size="23" text-anchor="end">01</text>
    </g>
    <g id="compare">
      <rect x="616" y="182" width="520" height="150" rx="10" fill="#1A2940"/>
      <path d="M617 210v94" stroke="#49D5B1" stroke-width="4"/>
      <text x="648" y="248" fill="#F6F3EB" font-size="50" font-weight="600">Compare</text>
      <text x="648" y="294" fill="#ACBDD2" font-size="28">Methods &amp; assumptions</text>
      <text x="1090" y="222" fill="#49D5B1" font-size="23" text-anchor="end">02</text>
    </g>
    <g id="check">
      <rect x="64" y="352" width="520" height="150" rx="10" fill="#1A2940"/>
      <path d="M65 380v94" stroke="#49D5B1" stroke-width="4"/>
      <text x="96" y="418" fill="#F6F3EB" font-size="50" font-weight="600">Check</text>
      <text x="96" y="464" fill="#ACBDD2" font-size="28">Metrics &amp; protocols</text>
      <text x="538" y="392" fill="#49D5B1" font-size="23" text-anchor="end">03</text>
    </g>
    <g id="reproduce">
      <rect x="616" y="352" width="520" height="150" rx="10" fill="#1A2940"/>
      <path d="M617 380v94" stroke="#49D5B1" stroke-width="4"/>
      <text x="648" y="418" fill="#F6F3EB" font-size="50" font-weight="600">Reproduce</text>
      <text x="648" y="464" fill="#ACBDD2" font-size="28">Baselines &amp; run records</text>
      <text x="1090" y="392" fill="#49D5B1" font-size="23" text-anchor="end">04</text>
    </g>
    <g id="diagnose">
      <rect x="64" y="522" width="520" height="150" rx="10" fill="#1A2940"/>
      <path d="M65 550v94" stroke="#49D5B1" stroke-width="4"/>
      <text x="96" y="588" fill="#F6F3EB" font-size="50" font-weight="600">Diagnose</text>
      <text x="96" y="634" fill="#ACBDD2" font-size="28">Rankings &amp; failure cases</text>
      <text x="538" y="562" fill="#49D5B1" font-size="23" text-anchor="end">05</text>
    </g>
    <g id="brief">
      <rect x="616" y="522" width="520" height="150" rx="10" fill="#1A2940"/>
      <path d="M617 550v94" stroke="#49D5B1" stroke-width="4"/>
      <text x="648" y="588" fill="#F6F3EB" font-size="50" font-weight="600">Brief</text>
      <text x="648" y="634" fill="#ACBDD2" font-size="28">Progress &amp; open questions</text>
      <text x="1090" y="562" fill="#49D5B1" font-size="23" text-anchor="end">06</text>
    </g>
    <text x="64" y="722" fill="#ACBDD2" font-size="27">For multimodal and cross-modal retrieval research.</text>
  </g>
</svg>
